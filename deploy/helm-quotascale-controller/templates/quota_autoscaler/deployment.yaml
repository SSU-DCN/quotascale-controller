{{- $container := .Values.containers.scaler -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ $container.name }}
    name: {{ $container.name }}
  name: {{ $container.name }}
  namespace: {{ $container.namespace }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ $container.name }}
      deployment: {{ $container.name }}
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ $container.name }}
        deployment: {{ $container.name }}
    spec:
      containers:
        - image: {{ $container.repository }}:{{ $container.tag }}
          imagePullPolicy: Always
          name: {{ $container.name }}
          args:
            - --enable-node-scaling={{ $container.enableNodeScaling | default false }}
            - --quota-check-interval={{ $container.quotaCheckInterval | default "1m" }}
            - --quota-update-interval={{ $container.quotaUpdateInterval | default "1m" }}
            - --node-scaling-max-nodes={{ $container.nodeScalingMaxNodes | default 3 }}
{{- if $container.nodeScalingRepoURL }}
            - --node-scaling-repo-url={{ $container.nodeScalingRepoURL }}
{{- end }}
{{- if $container.nodeScalingRepoBranch }}
            - --node-scaling-repo-branch={{ $container.nodeScalingRepoBranch }}
{{- end }}
{{- if $container.nodeScalingRepoFilePath }}
            - --node-scaling-repo-file-path={{ $container.nodeScalingRepoFilePath }}
{{- end }}
{{- if $container.nodeScalingGitUsername }}
            - --node-scaling-git-username={{ $container.nodeScalingGitUsername }}
{{- end }}
{{- if $container.nodeScalingGitPassword }}
            - --node-scaling-git-password={{ $container.nodeScalingGitPassword }}
{{- end }}
{{- if $container.gitopsSecretName }}
          envFrom:
            - secretRef:
                name: {{ $container.gitopsSecretName }}
{{- end }}
          resources:
            requests:
              cpu: "200m"
              memory: "2000M"
            limits:
              cpu: "2"
              memory: "2000M"
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: {{ $container.name }}-sa
      serviceAccountName: {{ $container.name }}-sa
      terminationGracePeriodSeconds: 6
