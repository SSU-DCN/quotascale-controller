{{- $container := .Values.containers.scaler -}}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quotascaler-clusterrole
rules:
  - apiGroups: ["dcn.ssu.ac.kr"]
    resources: ["quotaautoscalers"]
    verbs: ["get", "watch", "list", "update", "patch"]
  - apiGroups: ["dcn.ssu.ac.kr"]
    resources: ["nodescalinginventories"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["extensions"]
    resources: ["deployments"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["watch", "list", "get", "create", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list", "get", "update", "patch"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["watch", "list", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["watch", "list", "get", "create"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quotascaler-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quotascaler-clusterrole
subjects:
  - kind: ServiceAccount
    name: {{ $container.name }}-sa
    namespace: {{ $container.namespace }}
