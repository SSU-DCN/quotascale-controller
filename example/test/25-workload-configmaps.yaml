apiVersion: v1
kind: ConfigMap
metadata:
  name: quota-test-app-a-server
  namespace: quota-test-a
data:
  server.py: |
    import hashlib
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from socket import timeout as SocketTimeout
    from urllib.parse import parse_qs, urlparse

    HOST = "0.0.0.0"
    PORT = int(os.getenv("PORT", "8080"))
    DEFAULT_ROUNDS = int(os.getenv("DEFAULT_ROUNDS", "240000"))


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            parsed = urlparse(self.path)
            if parsed.path == "/healthz":
                self.respond(200, {"ok": True})
                return
            if parsed.path == "/burn":
                query = parse_qs(parsed.query)
                rounds = int(query.get("rounds", [str(DEFAULT_ROUNDS)])[0])
                password = query.get("password", ["quota-test-a"])[0].encode("utf-8")
                salt = query.get("salt", ["demo-salt-a"])[0].encode("utf-8")
                digest = hashlib.pbkdf2_hmac("sha512", password, salt, rounds)
                self.respond(
                    200,
                    {
                        "service": "quota-test-app-a",
                        "algorithm": "pbkdf2-hmac-sha512",
                        "rounds": rounds,
                        "digest": digest.hex(),
                    },
                )
                return
            self.respond(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            return

        def respond(self, code, body):
            data = json.dumps(body).encode("utf-8")
            try:
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            except (BrokenPipeError, ConnectionResetError, SocketTimeout):
                return


    ThreadingHTTPServer((HOST, PORT), Handler).serve_forever()
---
