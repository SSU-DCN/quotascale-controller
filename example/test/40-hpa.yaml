apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quota-test-app
  namespace: quota-test-a
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quota-test-app-a
  minReplicas: 1
  maxReplicas: 15
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 20
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
