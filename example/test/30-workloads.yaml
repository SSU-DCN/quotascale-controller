apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-test-app-a
  namespace: quota-test-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quota-test-app-a
  template:
    metadata:
      labels:
        app: quota-test-app-a
    spec:
      containers:
        - name: cpu-burn-a
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env:
            - name: PORT
              value: "8080"
            - name: DEFAULT_ROUNDS
              value: "240000"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: app
          configMap:
            name: quota-test-app-a-server
