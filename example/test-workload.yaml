apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-test-workload
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quota-test-workload
  template:
    metadata:
      labels:
        app: quota-test-workload
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "1200m"
              memory: "1Gi"
            limits:
              cpu: "1200m"
              memory: "1Gi"
